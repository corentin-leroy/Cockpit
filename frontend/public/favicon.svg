<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -32 512 512">
  <title>Cockpit</title>
  <style>
    /* Thème clair : mêmes couleurs que l'icône de l'extension (teal d'accent,
       fond crème, teal foncé). Thème sombre : le teal foncé disparaîtrait sur une
       barre d'onglets sombre (1,3 à 1,8:1), on reprend donc les tokens sombres de
       l'application. La forme et la luminosité portent le sens, pas la teinte :
       canopée/ciel 5,2:1 et ciel/sol 9,1:1 en clair ; canopée/ciel 7,6:1 en sombre. */
    .canopy { fill: #0f766e; }
    .sky { fill: #faf9f7; }
    .ground { fill: #094e49; }
    @media (prefers-color-scheme: dark) {
      .canopy { fill: #4bc0b4; }
      .sky { fill: #1b1d23; }
      .ground { fill: #4bc0b4; }
    }
  </style>
  <path class="canopy" d="M0 256V112a112 112 0 0 1 112-112h288a112 112 0 0 1 112 112v144z"/>
  <!-- Disque entier dessous, moitié haute par-dessus : pas de jointure claire à
       l'horizon quand le navigateur lisse les deux bords. -->
  <circle class="ground" cx="256" cy="256" r="162.5"/>
  <path class="sky" d="M93.5 256a162.5 162.5 0 0 1 325 0z"/>
</svg>
