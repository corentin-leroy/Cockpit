# Configuration d'Alembic (migrations de schéma).
#
# Toutes les commandes se lancent depuis backend/ avec l'exécutable du venv :
#   .venv\Scripts\python.exe -m alembic <commande>
#
# Il n'y a VOLONTAIREMENT aucune URL de base ici : alembic/env.py la prend dans
# app.database.DATABASE_URL, c'est-à-dire la même valeur, normalisée de la même
# façon (postgres:// -> postgresql+psycopg://), que celle de l'application.
# Une seule source de vérité, et aucun mot de passe dans un fichier versionné.

[alembic]
script_location = alembic

# Nom des fichiers de révision : date + identifiant + libellé, pour un tri
# chronologique naturel dans versions/.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Rend `import app` possible depuis env.py (backend/ est le dossier courant).
prepend_sys_path = .

path_separator = os

# --- Journalisation (configuration standard d'Alembic) ---

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
